name: OrderLab CI-CD
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: 3주차/orderlab-project
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Test with coverage
        run: python -m pytest --cov=orderlab --cov-report=term-missing --cov-report=xml
      - name: Bank account unit tests
        working-directory: 3주차/python/01-unit
        run: python -m pytest -q
      - name: Bank account integration tests
        working-directory: 3주차/python/02-integration
        run: python -m pytest -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.os }}
          path: 3주차/orderlab-project/coverage.xml
          if-no-files-found: ignore
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, test]
    runs-on: ubuntu-latest
    concurrency:
      group: orderlab-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: python generate_report.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 3주차/orderlab-project/site
      - id: deployment
        uses: actions/deploy-pages@v4
